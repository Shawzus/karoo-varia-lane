name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # publish the release
  packages: read    # download Hammerhead's karoo-ext library

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Test and build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      # Turn build errors into annotations so they show on the run summary page.
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk varia-lanes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: varia-lanes-apk
          path: varia-lanes.apk

      # Every build becomes the "latest" release, so this link always gets the newest APK:
      # https://github.com/Shawzus/karoo-varia-lane/releases/latest/download/varia-lanes.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: varia-lanes.apk
